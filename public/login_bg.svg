<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <radialGradient id="bgAmbient1" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#090E17" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="goldAmbient" cx="80%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#090E17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldAmbient" cx="15%" cy="85%" r="35%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#090E17" stop-opacity="0"/>
    </radialGradient>
    <pattern id="finGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.025"/>
    </pattern>
    <linearGradient id="chartStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Fondo base -->
  <rect width="1920" height="1080" fill="#090E17"/>
  <rect width="1920" height="1080" fill="url(#bgAmbient1)"/>
  <rect width="1920" height="1080" fill="url(#goldAmbient)"/>
  <rect width="1920" height="1080" fill="url(#emeraldAmbient)"/>
  <rect width="1920" height="1080" fill="url(#finGrid)"/>

  <!-- Líneas sutiles de mercado / velas / ondas de finanzas -->
  <path d="M 0 750 Q 300 700 600 730 T 1200 620 T 1920 540" fill="none" stroke="url(#chartStroke)" stroke-width="2"/>
  <path d="M 0 820 Q 400 780 800 810 T 1500 710 T 1920 660" fill="none" stroke="url(#chartStroke)" stroke-width="1.2" stroke-dasharray="6 6"/>

  <!-- Sellos tenues decorativos -->
  <circle cx="960" cy="540" r="380" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.03"/>
  <circle cx="960" cy="540" r="480" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.02" stroke-dasharray="8 8"/>
</svg>
